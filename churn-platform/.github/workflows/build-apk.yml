name: Build APK
on: { workflow_dispatch: { inputs: { server_url: { description: "Backend URL (https://...)", required: true, default: "http://10.0.2.2:8000" } } }, push: { branches: [main] } }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - run: gradle -p android assembleDebug -PSERVER_URL="${{ github.event.inputs.server_url || 'http://10.0.2.2:8000' }}"
      - uses: actions/upload-artifact@v4
        with: { name: churn-platform-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
